      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto</title>

  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">
          <img src="../img/logo.png" />
        </a>

      <nav class="header-nav">

    <main>
      <section>
        <h1 class="titulo-contacto text-dark">Contactanos</h1>
        <h2>Completa el formulario para enviarnos tu consulta.</h2>
        <form
          class="form-contacto"
          action="https://formspree.io/f/xqegrvdr"
          method="POST"
        >
          <div class="grupo-input">
            <label for="nombre">Nombre:</label>
            <input id="nombre" type="text" name="nombre" />
          </div>
          <div class="grupo-input">
            <label for="email">Tu email:</label>
            <input id="email" type="email" name="email" />
          </div>
          <div class="grupo-input">
            <label for="mensaje">Tu mensaje:</label>
            <textarea id="mensaje" type="mensaje" name="mensaje"></textarea>
          </div>
          <button class="btn bg-secondary text-dark" type="submit">
            Enviar
          </button>
        </form>
      </section>
      </main>
      <footer>
        <p>Impresiones Cocholate 2025</p>

        <ul class="footer-list">
          <li>
            <a href="https://wa.me/5491130013510" target="_blank">

            </a>
          <li>
            <a href="https://www.instagram.com/cocholate2020/">
